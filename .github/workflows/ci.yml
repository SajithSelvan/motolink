name: MotoLink CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-firmware:
    name: Build Embedded Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM GNU Toolchain & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi make cmake ninja-build

      - name: Verify Toolchain Installation
        run: arm-none-eabi-gcc --version

      - name: Build Application & Bootloader Firmware
        run: |
          if [ -f "Makefile" ]; then
            make all
          elif [ -f "CMakeLists.txt" ]; then
            cmake -B build -G Ninja
            cmake --build build
          else
            echo "Searching for firmware build directories..."
            for dir in firmware app bootloader src; do
              if [ -f "$dir/Makefile" ]; then
                make -C "$dir"
              elif [ -f "$dir/CMakeLists.txt" ]; then
                cmake -B "$dir/build" -S "$dir" -G Ninja
                cmake --build "$dir/build"
              fi
            done
          fi

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: motolink-firmware-binaries
          path: |
            **/*.bin
            **/*.hex
            **/*.elf
          if-no-files-found: warn

  build-gui:
    name: Build Desktop / Companion GUI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System & Qt Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools libgl1-mesa-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "gui/requirements.txt" ]; then
            pip install -r gui/requirements.txt
          fi

      - name: Build / Verify GUI Application
        run: |
          if [ -f "gui/CMakeLists.txt" ]; then
            cmake -B gui/build -S gui
            cmake --build gui/build
          elif ls gui/*.pro 1> /dev/null 2>&1; then
            mkdir -p gui/build && cd gui/build && qmake .. && make
          else
            echo "Checking Python GUI scripts..."
            find . -maxdepth 3 -name "*.py" -exec python -m py_compile {} +
          fi
